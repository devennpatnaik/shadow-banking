name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from the root package.json "packageManager" field

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Simulator smoke run (no network)
        run: |
          pnpm sim presets
          pnpm sim run --preset aave-v3-ethereum-wsteth-eth-emode --seed 1000 --format json > /tmp/run.json
          pnpm sim compare --seed 1000

      - name: Strategy compare smoke run (no network)
        run: |
          pnpm strategy compare --snapshot docs/data/market-snapshot-2026-10-21.json --seed 1000
          pnpm strategy compare --snapshot docs/data/market-snapshot-2026-10-21.json --seed 1000 --json > /tmp/strategy.json

      - name: Opportunity engine smoke run (fixture, no network)
        run: |
          pnpm opportunity help --json > /tmp/opportunity-help.json
          pnpm opportunity show --snapshot docs/data/market-snapshot-2026-10-21.json --json > /tmp/opportunity-show.json
          pnpm opportunity refresh --provider fixture --out /tmp/market-snapshot-fixture.json --json > /tmp/opportunity-refresh.json
          pnpm strategy compare --snapshot /tmp/market-snapshot-fixture.json --seed 1000 --json > /tmp/strategy-from-refresh.json
          pnpm sim run --snapshot /tmp/market-snapshot-fixture.json --network ethereum --collateral wstETH --borrow WETH --seed 1000 --format json > /tmp/sim-from-refresh.json

      - name: Accounting smoke run (no network)
        run: |
          pnpm accounting report --json > /tmp/accounting-report.json
          pnpm accounting ledger --json > /tmp/accounting-ledger.json
          pnpm accounting allocate --json > /tmp/accounting-allocate.json

      - name: Risk governor smoke run (no network)
        run: |
          pnpm risk state --json --fixture normal
          set +e
          pnpm risk evaluate --json --fixture emergency > /tmp/risk-emerg.json
          code=$?
          set -e
          test "$code" -eq 2
          pnpm sb risk --json --no-sim

      - name: Paper controller smoke run (fixture, no network)
        run: |
          pnpm paper help --json > /tmp/paper-help.json
          pnpm paper run --steps 3 --seed 1000 --provider fixture --state-dir /tmp/paper-run --json > /tmp/paper-run.json
          pnpm sb paper run --steps 2 --seed 1000 --json --state-dir /tmp/sb-paper-run > /tmp/sb-paper.json

      - name: Agent CLI smoke run (no network)
        run: |
          pnpm sb --help
          pnpm sb status --json > /tmp/sb-status.json
          pnpm sb risk --json --no-sim
          pnpm sb strategy --json > /tmp/sb-strategy.json
          pnpm sb accounting --json > /tmp/sb-accounting.json
          pnpm sb paper --help --json > /tmp/sb-paper-help.json
